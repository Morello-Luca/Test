[package]
name = "rust-ai-providers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Model provider adapters and llama.cpp local inference integration for RustAI"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]

[dependencies]
rust-ai-core = { path = "../rust-ai-core" }
llama-cpp-2 = "0.1.159"
encoding_rs = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
