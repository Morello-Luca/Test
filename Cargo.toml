# Cargo.toml workspace configuration for RustAI

[workspace]
members = [
    "crates/rust-ai-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustAI Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-ai/rust-ai"
rust-version = "1.80"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
